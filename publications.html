  <style>
    :root {
      --seo-ink: #2f3f42;
      --seo-muted: #667477;
      --seo-accent: #2f7f80;
      --seo-accent-dark: #236566;
      --seo-soft: #f3f7f7;
      --seo-line: #dce5e5;
      --seo-white: #ffffff;
    }

    .publications-intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      margin-bottom: 34px;
    }

    .publications-intro p {
      max-width: 880px;
      margin: 0;
      color: var(--seo-muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .profile-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .profile-button {
      display: inline-block;
      padding: 9px 13px;
      color: var(--seo-accent-dark);
      background: var(--seo-white);
      border: 1px solid var(--seo-line);
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .profile-button:hover,
    .profile-button:focus {
      color: var(--seo-white);
      background: var(--seo-accent);
      border-color: var(--seo-accent);
      text-decoration: none;
    }

    .publication-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 42px;
      padding: 0;
      list-style: none;
    }

    .publication-nav a {
      display: block;
      padding: 8px 12px;
      color: var(--seo-ink);
      background: var(--seo-soft);
      border: 1px solid var(--seo-line);
      border-radius: 18px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .publication-nav a:hover,
    .publication-nav a:focus {
      color: var(--seo-white);
      background: var(--seo-accent);
      border-color: var(--seo-accent);
      text-decoration: none;
    }

    .publication-section {
      margin-bottom: 50px;
      scroll-margin-top: 95px;
    }

    .publication-section-header {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 17px;
      padding-bottom: 11px;
      border-bottom: 2px solid var(--seo-line);
    }

    .publication-section-header h2 {
      margin: 0;
      color: var(--seo-ink);
      font-size: 27px;
      line-height: 1.3;
    }

    .publication-section-header p {
      margin: 0;
      color: var(--seo-muted);
      font-size: 13px;
    }

    .publication-year {
      margin: 34px 0 10px;
      padding-bottom: 7px;
      color: var(--seo-accent-dark);
      border-bottom: 1px solid var(--seo-line);
      font-size: 23px;
      line-height: 1.3;
    }


    #works .publication-year:first-child {
      margin-top: 0;
    }

    .publication-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .publication-item {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
      padding: 14px 0;
      border-bottom: 1px solid var(--seo-line);
    }

    .publication-item:last-child {
      border-bottom: 0;
    }

    .publication-item.no-image {
      grid-template-columns: 1fr;
    }

    .publication-thumb {
      display: block;
      overflow: hidden;
      width: 118px;
      height: 86px;
      background: #fafcfc;
      border: 1px solid var(--seo-line);
      border-radius: 4px;
    }

    .publication-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 5px;
    }

    .publication-body {
      min-width: 0;
    }

    .publication-title-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
    }

    .publication-title {
      margin: 0;
      color: var(--seo-ink);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
    }

    .publication-title a {
      color: inherit;
      text-decoration: none;
    }

    .publication-title a:hover,
    .publication-title a:focus {
      color: var(--seo-accent-dark);
      text-decoration: underline;
    }

    .publication-badge {
      flex: 0 0 auto;
      padding: 4px 7px;
      color: var(--seo-accent-dark);
      background: var(--seo-soft);
      border: 1px solid var(--seo-line);
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .publication-venue {
      margin: 4px 0 3px;
      color: var(--seo-accent-dark);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
    }

    .publication-authors {
      margin: 0;
      color: var(--seo-muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .self-author {
      color: var(--seo-ink);
      font-weight: 700;
    }


    .publication-cover {
      width: 100%;
      max-width: 310px;
      margin: 16px 0 3px;
    }

    .publication-cover a {
      display: block;
      padding: 7px;
      background: #fafcfc;
      border: 1px solid var(--seo-line);
      border-radius: 5px;
      box-shadow: 0 5px 16px rgba(32, 53, 56, 0.07);
      cursor: zoom-in;
    }

    .publication-cover img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      object-fit: contain;
    }

    .publication-cover figcaption {
      margin-top: 7px;
      color: #7a8789;
      font-size: 11px;
      line-height: 1.45;
      text-align: center;
    }

    .patent-item {
      padding-left: 18px;
      border-left: 3px solid var(--seo-accent);
    }

    .patent-status {
      color: var(--seo-accent-dark);
      font-weight: 700;
    }

    .publication-links {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }

    .publication-link {
      display: inline-block;
      padding: 4px 8px;
      color: var(--seo-accent-dark);
      background: var(--seo-white);
      border: 1px solid var(--seo-line);
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
    }

    .publication-link:hover,
    .publication-link:focus {
      color: var(--seo-white);
      background: var(--seo-accent);
      border-color: var(--seo-accent);
      text-decoration: none;
    }

    .publication-note {
      margin-top: 26px;
      padding: 14px 16px;
      color: var(--seo-muted);
      background: var(--seo-soft);
      border-left: 3px solid var(--seo-accent);
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.6;
    }

    .publication-loading,
    .publication-error {
      padding: 24px;
      color: var(--seo-muted);
      background: var(--seo-soft);
      border: 1px solid var(--seo-line);
      border-radius: 5px;
      text-align: center;
    }

    @media (max-width: 767px) {
      .publications-intro {
        grid-template-columns: 1fr;
      }

      .profile-buttons {
        justify-content: flex-start;
      }

      .publication-item {
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 13px;
      }

      .publication-thumb {
        width: 88px;
        height: 72px;
      }

      .publication-title-row {
        display: block;
      }

      .publication-badge {
        display: inline-block;
        margin-top: 6px;
      }
    }

    @media (max-width: 480px) {
      .publication-cover {
        max-width: 270px;
      }

      .publication-item,
      .publication-item.no-image {
        grid-template-columns: 1fr;
      }

      .publication-thumb {
        width: 100%;
        max-width: 180px;
        height: 105px;
      }
    }
  </style>

 J.; Han, Y. T.; Kim, D.-D.; Lee, J.; Suh, Y.-G.*","venue":"Organic Letters 2013, 15 (3), 531–533","year":2013,"sort_date":"2013-02-01","section":"prior","type":"article","badge":"Article","doi":"10.1021/ol303395f","image":"./img/publications/Incar.png","image_alt":"Graphical abstract for the stereoselective synthesis of 7-epi-incarvilline","links":[{"label":"Article","url":"https://doi.org/10.1021/ol303395f"}],"manual":true}],"patents":[{"title":"Electrochemical Target Species Capture with a Redox-Active Amine","inventors":"Trevor Alan Hatton; Hyowon Seo","assignee":"Massachusetts Institute of Technology","priority_year":2021,"sort_date":"2024-09-19","status":"Published Application","us_publication":"US 2024/0307819 A1","us_patent":"","pct_publication":"","other_publication":"","links":[{"label":"Google Patents","url":"https://patents.google.com/patent/US20240307819A1/en"}]}],"patent_note":"Only publicly available patent families should be listed. Add or update patent records manually."};

  </script>

  <script>
    (function () {
      "use strict";

      const root = document.getElementById("publication-root");

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function highlightSeo(authors) {
        const escaped = escapeHtml(authors);
        return escaped
          .replace(
            /Seo,\s*H\.(\*|†)?/g,
            '<span class="self-author">$&</span>'
          )
          .replace(
            /Hyowon Seo(\*|†)?/g,
            '<span class="self-author">$&</span>'
          );
      }

      function primaryLink(record) {
        if (Array.isArray(record.links) && record.links.length) {
          return record.links[0].url;
        }
        if (record.doi) {
          return "https://doi.org/" + record.doi;
        }
        return "";
      }

      function publicationItem(record) {
        const link = primaryLink(record);
        const title = escapeHtml(record.title);
        const titleMarkup = link
          ? `<a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${title}</a>`
          : title;

        const imageMarkup = record.image
          ? `
            <a
              class="publication-thumb"
              href="${escapeHtml(link || record.image)}"
              ${link ? 'target="_blank" rel="noopener noreferrer"' : ""}
            >
              <img
                src="${escapeHtml(record.image)}"
                alt="${escapeHtml(record.image_alt || record.title)}"
                loading="lazy"
              >
            </a>
          `
          : "";

        const recordLinks = Array.isArray(record.links)
          ? record.links
          : [];

        const coverLink = recordLinks.find((item) =>
          /cover/i.test(String(item.label || ""))
        );

        const linksMarkup = recordLinks
          .filter((item) => !/cover/i.test(String(item.label || "")))
          .map(
            (item) => `
              <a
                class="publication-link"
                href="${escapeHtml(item.url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${escapeHtml(item.label)}
              </a>
            `
          )
          .join("");

        const coverMarkup = coverLink
          ? `
            <figure class="publication-cover">
              <a
                href="${escapeHtml(coverLink.url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img
                  src="${escapeHtml(coverLink.url)}"
                  alt="${escapeHtml(
                    (coverLink.label || "Journal cover") +
                    " associated with " +
                    record.title
                  )}"
                  loading="lazy"
                >
              </a>
              <figcaption>
                ${escapeHtml(coverLink.label || "Journal cover")}
              </figcaption>
            </figure>
          `
          : "";

        return `
          <li class="publication-item${record.image ? "" : " no-image"}">
            ${imageMarkup}
            <article class="publication-body">
              <div class="publication-title-row">
                <h3 class="publication-title">${titleMarkup}</h3>
                ${record.badge ? `<span class="publication-badge">${escapeHtml(record.badge)}</span>` : ""}
              </div>
              <div class="publication-venue">${escapeHtml(record.venue)}</div>
              <p class="publication-authors">${highlightSeo(record.authors)}</p>
              ${linksMarkup ? `<div class="publication-links">${linksMarkup}</div>` : ""}
              ${coverMarkup}
            </article>
          </li>
        `;
      }

      function groupedByYear(records) {
        return records.reduce((groups, record) => {
          const year = String(record.year || "Other");
          if (!groups[year]) groups[year] = [];
          groups[year].push(record);
          return groups;
        }, {});
      }

      function renderYearGroups(records) {
        const groups = groupedByYear(records);
        return Object.keys(groups)
          .sort((a, b) => Number(b) - Number(a))
          .map((year) => {
            const items = groups[year]
              .sort((a, b) =>
                String(b.sort_date || b.year).localeCompare(
                  String(a.sort_date || a.year)
                )
              )
              .map(publicationItem)
              .join("");

            return `
              <h3 class="publication-year">${escapeHtml(year)}</h3>
              <ul class="publication-list">${items}</ul>
            `;
          })
          .join("");
      }

      function renderSection(id, title, description, records) {
        if (!records.length) return "";

        return `
          <section id="${id}" class="publication-section" aria-labelledby="${id}-heading">
            <div class="publication-section-header">
              <h2 id="${id}-heading">${escapeHtml(title)}</h2>
              <p>${escapeHtml(description)}</p>
            </div>
            ${renderYearGroups(records)}
          </section>
        `;
      }


      function patentItem(record) {
        const recordLinks = Array.isArray(record.links)
          ? record.links
          : [];

        const linksMarkup = recordLinks
          .map(
            (item) => `
              <a
                class="publication-link"
                href="${escapeHtml(item.url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                ${escapeHtml(item.label)}
              </a>
            `
          )
          .join("");

        const status = record.status || record.badge || "Public Patent Record";
        const numbers = [
          record.us_publication,
          record.us_patent,
          record.pct_publication,
          record.other_publication
        ].filter(Boolean).join(" · ");

        return `
          <li class="publication-item no-image patent-item">
            <article class="publication-body">
              <div class="publication-title-row">
                <h3 class="publication-title">${escapeHtml(record.title)}</h3>
                <span class="publication-badge">${escapeHtml(status)}</span>
              </div>
              ${record.inventors ? `<p class="publication-authors">${highlightSeo(record.inventors)}</p>` : ""}
              ${record.assignee ? `<div class="publication-venue">${escapeHtml(record.assignee)}</div>` : ""}
              ${numbers ? `<p class="publication-authors">${escapeHtml(numbers)}</p>` : ""}
              ${record.priority_year ? `<p class="publication-authors"><span class="patent-status">Priority:</span> ${escapeHtml(record.priority_year)}</p>` : ""}
              ${linksMarkup ? `<div class="publication-links">${linksMarkup}</div>` : ""}
            </article>
          </li>
        `;
      }

      function renderPatents(records) {
        if (!records.length) {
          return `
            <section id="patents" class="publication-section" aria-labelledby="patents-heading">
              <div class="publication-section-header">
                <h2 id="patents-heading">Patents and Applications</h2>
                <p>Selected publicly available patent families.</p>
              </div>
              <div class="publication-note">
                Public patent records will be added here as they become available.
              </div>
            </section>
          `;
        }

        const sorted = [...records].sort((a, b) =>
          String(b.sort_date || b.priority_year || "").localeCompare(
            String(a.sort_date || a.priority_year || "")
          )
        );

        return `
          <section id="patents" class="publication-section" aria-labelledby="patents-heading">
            <div class="publication-section-header">
              <h2 id="patents-heading">Patents and Applications</h2>
              <p>Selected publicly available patent families.</p>
            </div>
            <ul class="publication-list">
              ${sorted.map(patentItem).join("")}
            </ul>
          </section>
        `;
      }

      Promise.resolve(window.SEO_PUBLICATIONS_DATA)
        .then((data) => {
          if (!data || !Array.isArray(data.publications)) {
            throw new Error("Embedded publication data are missing or invalid.");
          }
          const records = Array.isArray(data.publications)
            ? data.publications
            : [];

          const patents = Array.isArray(data.patents)
            ? data.patents
            : [];

          const works = records.filter(
            (record) => record.section !== "patent"
          );

          root.innerHTML = `
            <section id="works" class="publication-section" aria-label="Publications and preprints">
              ${renderYearGroups(works)}
            </section>
          ` + renderPatents(patents);

          if (data.profile) {
            const scholar = document.getElementById("scholar-link");
            const orcid = document.getElementById("orcid-link");
            const legend = document.getElementById("publication-legend");

            if (data.profile.google_scholar) {
              scholar.href = data.profile.google_scholar;
            }
            if (data.profile.orcid) {
              orcid.href = "https://orcid.org/" + data.profile.orcid;
            }
            if (data.profile.legend) {
              legend.textContent = data.profile.legend;
            }
          }
        })
        .catch((error) => {
          console.error(error);
          root.innerHTML = `
            <div class="publication-error">
              The publication list could not be displayed.
              Please refresh the page.
            </div>
          `;
        });
    })();
  </script>
</body>
</html>
